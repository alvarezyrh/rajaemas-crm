# Local development infrastructure: PostgreSQL + Redis
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rajaemas
      POSTGRES_PASSWORD: rajaemas
      POSTGRES_DB: rajaemas_crm
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rajaemas -d rajaemas_crm']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  pgdata:
